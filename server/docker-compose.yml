name: study-server

services:
  # 关系型数据库：存素材元数据，以及纯文本资源的内容。
  postgres:
    image: postgres:16-alpine
    container_name: study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study_dev_password
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 对象存储：图片、音频、视频本体都放这里，库里只存 object_key。
  minio:
    image: minio/minio:latest
    container_name: study-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: study_minio
      MINIO_ROOT_PASSWORD: study_minio_secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 管理控制台
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
