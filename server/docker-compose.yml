name: study-server

services:
  # 关系型数据库：存素材元数据，以及纯文本资源的内容。
  postgres:
    image: postgres:16-alpine
    container_name: study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study_dev_password
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 对象存储：图片、音频、视频本体都放这里，库里只存 object_key。
  # 说明：MinIO 官方镜像在当前网络环境不可拉取，改用 S3 协议兼容的
  # SeaweedFS（weed server 一体化模式，S3 端口同为 9000）；
  # 配置走 .env，换回 MinIO 只需改本文件镜像与 command。
  storage:
    image: docker.1ms.run/chrislusf/seaweedfs:3.80
    container_name: study-storage
    restart: unless-stopped
    command: "server -dir=/data -ip=0.0.0.0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=9000"
    ports:
      - "9000:9000" # S3 API
      - "9333:9333" # master 管理页
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
