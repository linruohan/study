name: Flutter Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 打标签前先确认标签号与 pubspec 版本一致，避免发错版本
  check-version:
    name: 校验版本号
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 比对标签与 pubspec.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(grep -E '^version:' app/pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//; s/["'\'']//g' | tr -d '[:space:]')
          EXPECTED="${TAG#v}"
          echo "pubspec 版本：$VERSION，标签：$TAG"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::标签 $TAG 与 app/pubspec.yaml 中的版本 $VERSION 不一致"
            exit 1
          fi

  build:
    name: 构建
    needs: check-version
    uses: ./.github/workflows/flutter-build.yml

  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 下载 Android 产物
        uses: actions/download-artifact@v4
        with:
          name: study-app-android
          path: dist

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: study-app-windows
          path: dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/app-release.apk
            dist/study-app-windows-x64.zip
