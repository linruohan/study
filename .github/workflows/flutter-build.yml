name: Flutter 构建（可复用）

on:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'
  APP_DIR: app

jobs:
  # 静态检查与单元测试：所有构建都以它为前提
  analyze-test:
    name: 分析与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos

      - name: 运行测试
        run: flutter test --reporter expanded

  # Android 安装包
  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: study-app-android
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Windows 桌面版
  build-windows:
    name: 构建 Windows
    runs-on: windows-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 release 包
        run: flutter build windows --release

      - name: 打包产物
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "study-app-windows-x64.zip" -Force

      - name: 上传 Windows 包
        uses: actions/upload-artifact@v4
        with:
          name: study-app-windows
          path: ${{ env.APP_DIR }}/study-app-windows-x64.zip
          if-no-files-found: error
